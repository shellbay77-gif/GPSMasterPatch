name: Build GPSMasterPatch

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          brew install ldid make
          git clone --recursive https://github.com/theos/theos.git $THEOS
        env:
          THEOS: ${{ runner.temp }}/theos

      - name: Setup iOS SDK
        run: |
          cd $THEOS/sdks
          curl -sL https://github.com/theos/sdks/releases/latest/download/sdks.tar.xz | tar xJf -
        env:
          THEOS: ${{ runner.temp }}/theos

      - name: Build Package
        run: |
          gmake package FINALPACKAGE=1
        env:
          THEOS: ${{ runner.temp }}/theos

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GPSMasterPatch-deb
          path: packages/*.deb
