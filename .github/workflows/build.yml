name: Build GPSMasterPatch Combined

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          set -e
          brew install ldid xz make
          export THEOS=~/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          curl -LO https://github.com/theos/sdks/archive/refs/heads/master.zip
          unzip -q master.zip
          mv sdks-master/*.sdk $THEOS/sdks/ 2>/dev/null || true
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: Build Membership Patch Dylib
        run: |
          export THEOS=~/theos
          export PATH=$THEOS/bin:$PATH
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          echo "Patch built:"
          ls packages/

      - name: Download Original GPS Master Deb
        run: |
          curl -L "http://apt.thebigboss.org/repofiles/cydia/debs2.0/gpsmaster_2.2.7.deb" -o gpsmaster_orig.deb
          ls -lh gpsmaster_orig.deb

      - name: Extract and Combine
        run: |
          set -e
          
          # Extract our patch deb to get the built dylib
          mkdir -p patch_extracted
          cd patch_extracted
          ar x ../packages/*.deb
          tar xf data.tar* 2>/dev/null || true
          cd ..
          
          # Extract original GPS Master deb
          mkdir -p gpsmaster_extracted
          cd gpsmaster_extracted
          ar x ../gpsmaster_orig.deb
          tar xf data.tar* 2>/dev/null || true
          cd ..
          
          # Create combined rootless layout
          mkdir -p combined/var/jb/Applications
          mkdir -p combined/var/jb/Library/MobileSubstrate/DynamicLibraries
          
          # Copy GPS Master app
          cp -r gpsmaster_extracted/Applications/GpsMaster.app combined/var/jb/Applications/
          
          # Copy original GPS Master plugin dylib + plist
          cp gpsmaster_extracted/Library/MobileSubstrate/DynamicLibraries/gpsmasterplugin.dylib \
             combined/var/jb/Library/MobileSubstrate/DynamicLibraries/
          cp gpsmaster_extracted/Library/MobileSubstrate/DynamicLibraries/gpsmasterplugin.plist \
             combined/var/jb/Library/MobileSubstrate/DynamicLibraries/
          
          # Copy our membership patch dylib + plist
          cp patch_extracted/var/jb/Library/MobileSubstrate/DynamicLibraries/GPSMasterPatch.dylib \
             combined/var/jb/Library/MobileSubstrate/DynamicLibraries/
          cp patch_extracted/var/jb/Library/MobileSubstrate/DynamicLibraries/GPSMasterPatch.plist \
             combined/var/jb/Library/MobileSubstrate/DynamicLibraries/
          
          echo "Combined layout:"
          find combined -type f | sort

      - name: Package Combined Deb
        run: |
          set -e
          brew install dpkg

          mkdir -p combined/DEBIAN

          # Control file from repo (avoids heredoc/YAML indent issues)
          cp combined.control combined/DEBIAN/control

          printf '#!/bin/bash\nuicache -a 2>/dev/null || true\nkillall -9 SpringBoard 2>/dev/null || true\nexit 0\n' > combined/DEBIAN/postinst
          chmod 755 combined/DEBIAN/postinst

          mkdir -p final_packages

          dpkg-deb --build combined final_packages/com.shellbay77.gpsmastercomplete_2.2.7_iphoneos-arm64.deb

          echo "Final package:"
          ls -lh final_packages/

      - name: Upload Combined Deb
        uses: actions/upload-artifact@v4
        with:
          name: GPSMasterComplete-deb
          path: final_packages/*.deb