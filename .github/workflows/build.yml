name: Build GPSMasterPatch

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot

      - name: Setup Theos
        uses: nscale/action-setup-theos@v1
        with:
          theos-version: master

      - name: Build Package
        run: make package FINALPACKAGE=1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GPSMasterPatch-deb
          path: packages/*.deb
